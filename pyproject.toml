[project]
name = "bytepair"
version = "0.1.0"
description = "Byte-level BPE tokenizer written from scratch in pure Python."
readme = "README.md"
license = "MIT"
authors = [{ name = "Cameron Ervin" }]
requires-python = ">=3.12"
dependencies = ["regex>=2024.0", "rich>=13.0"]

[project.optional-dependencies]
gpt4 = ["tiktoken>=0.7"]

[project.scripts]
bytepair = "bytepair.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "tiktoken>=0.7", "jupyter>=1.0", "nbconvert>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
